
parameters:
  - name: messageText
    type: string
    default: 'Hello from reusable template'

  - name: environmentText
    type: string
    default: 'DEV'

  - name: runMessage
    displayName: Run Message
    type: boolean
    default: true

steps:
  - script: |
      echo "${{ parameters.messageText }}"
      echo "Environment: ${{ parameters.environmentText }}"
    displayName: 'Print Parameterized Message'
    condition: and(succeeded(), eq(${{ parameters.runMessage }}, true))



