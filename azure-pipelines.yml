
trigger: none

pool:
  name: Final-pool_17oct

variables:
  - group: 17Oct-Pipeline-Variables

parameters:
  - name: runValidation
    displayName: Run Validation Stage
    type: boolean
    default: true

  - name: runSecondStage
    displayName: Run Second Stage
    type: boolean
    default: true

stages:
  - stage: IndependentStage
    displayName: Independent Stage
    dependsOn: []
    jobs:
      - job: IndependentJob
        displayName: Independent Job
        steps:
          - script: echo "I run independently!"
            displayName: Independent Stage Message

  
  - stage: TerraformInit
    displayName: Terraform Init
    dependsOn: []
    jobs:
      - job: InitJob
        displayName: Initialize Terraform
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3' 

          - script: terraform init
            displayName: Terraform Init
            workingDirectory: '$(System.DefaultWorkingDirectory)'

  
  
  - stage: TerraformValidate
    displayName: Terraform Validate
    dependsOn: TerraformInit
    condition: succeeded()
    jobs:
      - job: ValidateJob
        displayName: Validate Terraform Configuration
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - script: terraform init
            displayName: Terraform Init for Validate
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          - script: terraform validate
            displayName: Terraform Validate
            workingDirectory: '$(System.DefaultWorkingDirectory)'

  - stage: TerraformPlan
    displayName: Terraform Plan
    dependsOn: TerraformValidate
    condition: succeeded()
    jobs:
      - job: PlanJob
        displayName: Generate Terraform Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - script: terraform init
            displayName: Terraform Init for Plan
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          - script: terraform plan -out=tfplan
            displayName: Terraform Plan
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          - publish: '$(System.DefaultWorkingDirectory)/tfplan'
            artifact: terraform-plan
            displayName: Publish Terraform Plan


  - stage: BasicPipeline
    displayName: Basic Pipeline
    condition: and(succeeded(), eq(${{ parameters.runValidation }}, true))
    jobs:
      - job: FirstJob
        displayName: First Job
        steps:
          - script: echo "Basic Pipeline is running."
            displayName: Basic Pipeline Message

          - script: |
              echo "Message: $(message)"
              echo "Environment: $(environmentName)"
            displayName: Print Pipeline Variables

          - template: templates/print-message.yml
            parameters:
              messageText: 'Hello from Validation'
              environmentText: 'QA'
              runMessage: true

  - stage: TestStage
    displayName: Test Stage
    dependsOn: BasicPipeline
    condition: and(succeeded(), eq(${{ parameters.runSecondStage }}, true))
    jobs:
      - job: TestJob
        displayName: Test Job
        steps:
          - script: echo "Running tests..."
            displayName: Run Tests
            
  - stage: SecurityStage
    displayName: Security Stage
    dependsOn: BasicPipeline
    condition: succeeded()
    jobs:
      - job: SecurityJob
        displayName: Security Job
        steps:
          - script: echo "Running security checks..."
            displayName: Security Checks


  
  - stage: ApprovalStage
    displayName: Manual Approval
    dependsOn:
      - TerraformPlan
      - TestStage
      - SecurityStage
    condition: succeeded()
    jobs:
      - job: WaitForApproval
        displayName: Wait for Manual Approval
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 720
            inputs:
              notifyUsers: ''
              instructions: 'Please review the pipeline results and approve to continue.'
              onTimeout: reject

  - stage: TerraformApply
    displayName: Terraform Apply
    dependsOn:
      - TerraformPlan
      - ApprovalStage
    condition: succeeded()
    jobs:
      - job: ApplyJob
        displayName: Apply Terraform Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          

          - download: current
            artifact: terraform-plan
            displayName: Download Terraform Plan

          - script: terraform init
            displayName: Terraform Init for Apply
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          - script: terraform apply -auto-approve "$(Pipeline.Workspace)/terraform-plan/tfplan"
            displayName: Terraform Apply
            workingDirectory: '$(System.DefaultWorkingDirectory)'


  - stage: FinalStage
    displayName: Final Stage
    dependsOn: TerraformApply
    condition: succeeded()
    jobs:
      - job: FinalJob
        displayName: Final Job
        steps:
          - script: echo "Both parallel stages completed successfully!"
            displayName: Final Confirmation

 

