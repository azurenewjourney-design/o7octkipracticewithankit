
trigger: none

pool:
  name: Final-pool_17oct

variables:
  - group: 17Oct-Pipeline-Variables

parameters:
  - name: runValidation
    displayName: Run Validation Stage
    type: boolean
    default: true

  - name: runSecondStage
    displayName: Run Second Stage
    type: boolean
    default: true

stages:
  - stage: BasicPipeline
    displayName: Basic Pipeline
    condition: and(succeeded(), eq(${{ parameters.runValidation }}, true))
    jobs:
      - job: FirstJob
        displayName: First Job
        steps:
          - script: echo "Hello! My first YAML pipeline is running."
            displayName: Print Hello Message

          - script: |
              echo "Message: $(message)"
              echo "Environment: $(environmentName)"
            displayName: Print Pipeline Variables

          - template: templates/print-message.yml
            parameters:
              messageText: 'Hello from Validation'
              environmentText: 'QA'
              runMessage: true

          - template: templates/print-message.yml
            parameters:
              messageText: 'Hello from Production'
              environmentText: 'PROD'
              runMessage: false
              
          
          - script: |
              echo "Failure detected! Running diagnostic message."
            displayName: Handle Failure
            condition: failed()     

          
          - script: |
              echo "This step runs for success or failure."
            displayName: Always Run Message
            condition: always()

        
          - script: |
              echo "This step will fail, but the job should continue."
              exit 1
            displayName: Continue On Error Test
            continueOnError: true

          - script: |
              echo "Pipeline continued after the failed step."
            displayName: Verify Pipeline Continued

         
          - script: |
              echo "This step runs after success or failure."
            displayName: Succeeded Or Failed Test
            condition: succeededOrFailed()

          
          - script: |
              echo "This is the Production-only step."
            displayName: Production Only Step
            condition: and(succeeded(), eq(variables['environmentName'], 'PROD'))





  - stage: SecondStage
    displayName: Second Stage
    dependsOn: BasicPipeline
    condition: and(succeeded(), eq(variables['environmentName'], 'PROD'))
    jobs:
      - job: SecondJob
        displayName: Second Job
        steps:
          - script: echo "My second stage is running."
            displayName: Print Second Message

