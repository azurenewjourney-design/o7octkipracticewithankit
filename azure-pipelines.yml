
trigger: none

pool:
  name: Final-pool_17oct

variables:
  - group: 17Oct-Pipeline-Variables

parameters:
  - name: runValidation
    displayName: Run Validation Stage
    type: boolean
    default: true

  - name: runSecondStage
    displayName: Run Second Stage
    type: boolean
    default: true

stages:
  - stage: BasicPipeline
    displayName: Basic Pipeline
    condition: and(succeeded(), eq(${{ parameters.runValidation }}, true))
    jobs:
      - job: FirstJob
        displayName: First Job
        steps:
          - script: echo "Basic Pipeline is running."
            displayName: Basic Pipeline Message

          - script: |
              echo "Message: $(message)"
              echo "Environment: $(environmentName)"
            displayName: Print Pipeline Variables

          - template: templates/print-message.yml
            parameters:
              messageText: 'Hello from Validation'
              environmentText: 'QA'
              runMessage: true

  - stage: TestStage
    displayName: Test Stage
    dependsOn: BasicPipeline
    condition: and(succeeded(), eq(${{ parameters.runSecondStage }}, true))
    jobs:
      - job: TestJob
        displayName: Test Job
        steps:
          - script: |
              echo "Testing parallel stage failure"
              exit 1
            displayName: Intentionally Fail Test Stage

  - stage: SecurityStage
    displayName: Security Stage
    dependsOn: BasicPipeline
    condition: succeeded()
    jobs:
      - job: SecurityJob
        displayName: Security Job
        steps:
          - script: echo "Running security checks..."
            displayName: Security Checks

  - stage: FinalStage
    displayName: Final Stage
    dependsOn:
      - TestStage
      - SecurityStage
    condition: always()
    jobs:
      - job: FinalJob
        displayName: Final Job
        steps:
          - script: echo "Both parallel stages completed successfully!"
            displayName: Final Confirmation

 

