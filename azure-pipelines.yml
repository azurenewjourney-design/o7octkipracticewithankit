
trigger: none

pool:
  name: Final-pool_17oct

variables:
  - group: 17Oct-Pipeline-Variables

parameters:
  - name: runValidation
    displayName: Run Validation Stage
    type: boolean
    default: true

  - name: runSecondStage
    displayName: Run Second Stage
    type: boolean
    default: true

stages:
  - stage: BasicPipeline
    displayName: Basic Pipeline
    condition: and(succeeded(), eq(${{ parameters.runValidation }}, true))
    jobs:
      - job: FirstJob
        displayName: First Job
        steps:
          - script: echo "Basic Pipeline is running."
            displayName: Basic Pipeline Message

          - script: |
              echo "Message: $(message)"
              echo "Environment: $(environmentName)"
            displayName: Print Pipeline Variables

          - template: templates/print-message.yml
            parameters:
              messageText: 'Hello from Validation'
              environmentText: 'QA'
              runMessage: true

  - stage: SecondStage
    displayName: Second Stage
    dependsOn: BasicPipeline
    condition: and(succeeded(), eq(${{ parameters.runSecondStage }}, true))
    jobs:
      - job: SecondJob
        displayName: Second Job
        
        steps:
          - script: |
              echo "Step 1: This step will succeed"
            displayName: 'Step 1 - Success'

          - script: |
              echo "Step 2: This step will fail"
              exit 1
            displayName: 'Step 2 - Failure'

          - script: |
              echo "Step 3: This runs only if previous steps succeeded"
            displayName: 'Step 3 - succeeded()'
            condition: succeeded()

          - script: |
              echo "Step 4: This runs when a previous step fails"
            displayName: 'Step 4 - failed()'
            condition: failed()

          - script: |
              echo "Step 5: This runs regardless of success or failure"
            displayName: 'Step 5 - always()'
            condition: always()


          

  - stage: DeployStage
    displayName: Deploy Stage
    dependsOn: SecondStage
    condition: succeeded()
    jobs:
      - job: DeployJob
        displayName: Deploy Job
        steps:
          - script: echo "Deployment stage completed successfully."
            displayName: Deployment Message

 

