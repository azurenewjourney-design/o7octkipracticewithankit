
trigger: none

pool:
  name: Final-pool_17oct

parameters:
  - name: runValidation
    displayName: Run Validation Stage
    type: boolean
    default: true
  - name: runSecondStage
    displayName: Run Second Stage
    type: boolean
    default: true

stages:
  - stage: BasicPipeline
    displayName: Basic Pipeline
    condition: and(succeeded(), eq(${{ parameters.runValidation }}, true))
    jobs:
      - job: FirstJob
        displayName: First Job
        steps:
          - script: echo "Hello! My first YAML pipeline is running."
            displayName: Print Hello Message

  - stage: SecondStage
    displayName: Second Stage
    dependsOn: BasicPipeline
    condition: and(succeeded(), eq(${{ parameters.runSecondStage }}, true))
    jobs:
      - job: SecondJob
        displayName: Second Job
        steps:
          - script: echo "My second stage is running."
            displayName: Print Second Message


